<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox cart</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./Cart.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap');
    </style>
</head>

<body>
    <script src="https://kit.fontawesome.com/0dd752709c.js" crossorigin="anonymous"></script>
    <header>
        <nav>
            <div class="logo">
                <!-- Logo -->
                <!--h2><span style="color: red;">Bite Box</span></h2-->
                <img src="../images/logo-bb4.png" width="90px" height="60px">
            </div>

            <!-- Menu -->
            <ul type="none">
                <li><a href="./index.html" target="_blank"><i class="fa-solid fa-house-user"></i></a></li>
                <li><a href="./Menu.html" target="_self"><i class="fa-solid fa-bars"></i></a></li>
                <li><a href="./BiteDeals.html">Bite Deals</a></li>
                <li><a href="./Cart.html"><i class="fa-solid fa-cart-plus"></i>Cart</a></li>
                <li><a href="./Login.html"><button id="login-button"><i
                                class="fa-solid fa-right-to-bracket"></i>Login</button></a></li>
            </ul>
        </nav>
    </header>
    <!--h3>This is cart page.</h3-->

    <!-- Cart Table -->
    <section class="cart">

        <table>
            <thead>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Remove</th>
            </thead>
            <tbody>
                <tr>
                    <td class="item">
                        <img src="../images/burgerr.jpg" alt="">
                        <div>
                            <h4>Cheesy Burger</h4>
                            <p>Cheesy Grilledn Burger</p>
                        </div>
                    </td>
                    <td>₹199</td>
                    <td>
                        <div class="qty-box">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </td>
                    <td>₹199</td>
                    <td><button class="remove">X</button></td>
                </tr>
                <tr class="grand_total">
                    <td colspan="3">Grand Total</td>
                    <td>₹199</td>
                    <td><button>Proceed</button></td>
                </tr>
            </tbody>
        </table>
    </section>
</body>

</html>
