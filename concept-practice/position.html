<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Demo</title>
    <link rel="stylesheet" href="position.css">
</head>

<body>
    <h1>Position Demo</h1>

    <section>
        <h2>1. Static (default)</h2>
        <div class="box static">I am a stactic block.</div>
    </section>

    <section>
        <h2>2. Relative</h2>
        <div class="box relative">I am a relative block.</div>
    </section>

    <section class="container">
        <h2>3. Absolute (inside the container)</h2>
        <div class="box absolute"> I am an absolute block.</div>
        <p>I am a container <code>position:</code></p>
    </section>

    <section>
        <h2>4. Fixed </h2>
        <div class="box fixed"> I am fixed block.</div>
        <div style="height: 800px;"></div>
    </section>

    <section>
        <h2>5. Sticky </h2>
        <div class="box sticky">I am a sticky block.</div>
        <div style="height: 800px;"></div>
    </section>


</body>

</html>
