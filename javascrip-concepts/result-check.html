<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Check</title>
</head>
<body>
    <h2>Student Grade System</h2>
    <input type="text" id="marks" placeholder="Enter your marks">
    <button onclick="checkGrade()">Check Grade</button>

    <p id="result">Result ? </p>

    <script>
        function checkGrade(){
            let marks = Number(document.getElementById("marks").value);
            let result = document.getElementById("result");

            if(marks >=90)
        {
            result.style.color="green"
            result.innerHTML="Grade : A+ Excellent work!!"
        }
        else if (marks >= 80 && marks <90)
        {
            result.style.color="green"
            result.innerHTML = "Grade : A Good work!!"
        }
        else if (marks >= 60 && marks <80)
        {
            result.style.color="blue"
            result.innerHTML = "Grade : B Need to do hard work!!"
        }
        else if (marks >= 45 && marks <60)
        {
            result.style.color="orange"
            result.innerHTML = "Grade : C Promoted..Need to do hard work!!"
        }
        else
        {
            result.style.background="red"
            result.style.color="black"
            result.innerHTML = "Grade : Fail"
        }
        }
    </script>
</body>
</html>
